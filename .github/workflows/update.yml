name: 每週更新資料

on:
  schedule:
    - cron: '17 19 * * 0'   # 每週一 03:17（台灣時間）
  workflow_dispatch:         # 也可在 Actions 頁面按 Run workflow 手動更新

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 更新榮家床位與長照新聞
        run: python update.py
      - name: 有變動才存檔
        run: |
          git config user.name "ltc-bot"
          git config user.email "ltc-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "沒有變動" || git commit -m "每週自動更新 $(date +%F)"
          git push
